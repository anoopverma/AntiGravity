<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AntiGravity — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body class="login-body">
    <div class="login-box">
        <div class="logo">
            <div class="logo-icon">⚡</div>
            <div class="logo-text">Anti<span>Gravity</span></div>
        </div>
        <div class="subtitle">Strategy Engine — Secure Access</div>

        {% if error %}
        <div class="error-msg">
            <span>⚠</span> {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username"
                    value="{{ username|default('') }}" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter password"
                    autocomplete="current-password" required>
            </div>
            <button class="btn-login" type="submit">Sign In →</button>
        </form>

        <hr class="divider">
        <div class="footer-note">Protected by AntiGravity &nbsp;·&nbsp; <span>v4.0</span></div>
    </div>
</body>

</html>
