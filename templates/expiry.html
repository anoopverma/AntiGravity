<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expiry Calendar — AntiGravity</title>
    <meta name="description" content="View upcoming weekly option expiry dates for NIFTY 50, BANKNIFTY, SENSEX, FINNIFTY and MIDCPNIFTY.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <h1>📅 <span>Expiry Calendar</span></h1>
                <p>Real-time tracked option expiries with strategy performance analytics</p>
            </div>
            <div class="nav-links">
                <a href="/" class="nav-btn primary">← Dashboard</a>
                <a href="/backtest" class="nav-btn">Backtest</a>
                <a href="/logout" class="nav-btn">Sign Out</a>
            </div>
        </div>

        <!-- Today chip -->
        <div class="today-chip">
            🗓 Today: <b id="today-label">Loading…</b>
        </div>

        <!-- Error -->
        <div id="error-msg"></div>

        <!-- Cards (Nearest) -->
        <div class="section-header" style="margin-top: 0;">
            <div class="section-title">Nearest Expiries</div>
            <button class="refresh-btn" onclick="loadExpiries()">↻ Refresh All</button>
        </div>
        <div class="grid" id="cards-grid">
            <!-- populated by JS -->
        </div>

        <!-- Calendar Section -->
        <div class="section-header">
            <div class="section-title">3-Month Calendar</div>
            <div class="filter-group">
                <label for="index-filter" style="font-size:0.8rem; color:var(--text-dim);">Filter Index:</label>
                <select id="index-filter" class="index-select" onchange="applyFilter()">
                    <option value="ALL">All Indices</option>
                    <option value="NIFTY 50">NIFTY 50</option>
                    <option value="BANKNIFTY">BANKNIFTY</option>
                    <option value="SENSEX">SENSEX</option>
                    <option value="FINNIFTY">FINNIFTY</option>
                </select>
            </div>
        </div>
        <div class="table-wrap calendar-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Script</th>
                        <th>Expiry Date</th>
                        <th>Day</th>
                        <th>Source</th>
                        <th style="width:120px;">Quick Actions</th>
                    </tr>
                </thead>
                <tbody id="calendar-tbody">
                    <tr><td colspan="5" style="color:var(--text-dim); text-align:center; padding:3rem;">Loading calendar…</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Expiry Strategy Details Panel -->
        <div style="background:rgba(255,255,255,0.02); border:1px solid #333; border-radius:8px; padding:1.5rem; margin:2rem 0; display:none;" id="expiry-stats-panel">
            <div style="font-size:1.1rem; font-weight:600; margin-bottom:1rem; color:#e2e8f0;">
                📊 Strategy Performance for <span id="expiry-date-label" style="color:#60a5fa;"></span>
            </div>
            <div id="expiry-stats-container" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap:1rem; margin-bottom:1.5rem;">
                <div style="text-align:center; color:var(--text-dim);">Loading performance data...</div>
            </div>
            <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button onclick="runBacktestForExpiry()" style="flex:1; min-width:140px; padding:0.5rem 1rem; background:linear-gradient(135deg,#59ba43,#228236); color:white; border:none; border-radius:6px; font-weight:600; cursor:pointer;">
                    ▶ Run Backtest for This Date
                </button>
                <button onclick="closeExpiryStats()" style="flex:1; min-width:140px; padding:0.5rem 1rem; background:rgba(100,100,120,0.2); color:#aaa; border:1px solid #555; border-radius:6px; font-weight:600; cursor:pointer;">
                    ✕ Close
                </button>
            </div>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        /* ── Helpers ────────────────────────────────── */
        let calendarData = []; // Local cache for filtering
        let selectedExpiryDate = null;

        const CARD_CLASS = {
            'NIFTY 50':   'card-nifty',
            'BANKNIFTY':  'card-banknifty',
            'SENSEX':     'card-sensex',
            'FINNIFTY':   'card-finnifty'
        };
        const DOT_CLASS = {
            'NIFTY 50':   'dot-nifty',
            'BANKNIFTY':  'dot-banknifty',
            'SENSEX':     'dot-sensex',
            'FINNIFTY':   'dot-finnifty'
        };

        function daysAway(isoStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const target = new Date(isoStr);
            return Math.round((target - today) / 86400000);
        }

        function badgeHtml(days) {
            if (days === 0) return `<span class="card-days-badge badge-today">⚡ Today</span>`;
            if (days < 0) return `<span class="card-days-badge badge-normal">Expired</span>`;
            if (days <= 2)  return `<span class="card-days-badge badge-soon">${days}d left</span>`;
            return `<span class="card-days-badge badge-normal">${days}d to go</span>`;
        }

        /* ── Main fetch ─────────────────────────────── */
        async function loadExpiries() {
            const errBox = document.getElementById('error-msg');
            errBox.style.display = 'none';
            try {
                // 1. Fetch nearest
                const res1 = await fetch('/api/expiries');
                const json1 = await res1.json();
                if (json1.status === 'success') renderCards(json1.data);

                // 2. Fetch full calendar
                const res2 = await fetch('/api/expiries/all');
                const json2 = await res2.json();
                if (json2.status === 'success') {
                    calendarData = json2.data;
                    applyFilter();
                }

                document.getElementById('last-updated').textContent =
                    'Last synced: ' + new Date().toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata'}) + ' IST';

            } catch (err) {
                errBox.textContent = '⚠ Update Error: ' + err.message;
                errBox.style.display = 'block';
            }
        }

        function renderCards(data) {
            const grid = document.getElementById('cards-grid');
            grid.innerHTML = '';
            data.filter(i => CARD_CLASS[i.script]).forEach(item => {
                const days     = daysAway(item.expiry_iso);
                const cardCls  = CARD_CLASS[item.script] || '';
                const card = document.createElement('div');
                card.className = `expiry-card ${cardCls}`;
                card.innerHTML = `
                    <div class="card-label">Next Up</div>
                    <div class="card-script">${item.script}</div>
                    <div class="card-expiry-date">${item.expiry}</div>
                    ${badgeHtml(days)}
                `;
                grid.appendChild(card);
            });
        }

        function applyFilter() {
            const filterVal = document.getElementById('index-filter').value;
            const filtered = filterVal === 'ALL' 
                ? calendarData 
                : calendarData.filter(i => i.script === filterVal);
            renderCalendar(filtered);
        }

        function renderCalendar(data) {
            const tbody = document.getElementById('calendar-tbody');
            tbody.innerHTML = '';
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:var(--text-dim); text-align:center; padding:3rem;">No records found.</td></tr>';
                return;
            }
            data.forEach(item => {
                const dotCls = DOT_CLASS[item.script] || '';
                const tr = document.createElement('tr');
                const sourceCls = item.source === 'holiday-adjusted' ? 'source-holiday' : '';
                tr.innerHTML = `
                    <td><span class="dot ${dotCls}"></span><strong>${item.script}</strong></td>
                    <td style="font-family:monospace; font-weight:500;">${item.expiry}</td>
                    <td style="color:var(--text-dim);">${item.day_label}</td>
                    <td><span class="source-tag ${sourceCls}">${item.source}</span></td>
                    <td>
                        <button onclick="showExpiryStats('${item.expiry}', '${item.expiry_iso}')" style="padding:0.3rem 0.6rem; background:rgba(59,130,246,0.2); color:#60a5fa; border:1px solid #1e40af; border-radius:4px; font-size:0.75rem; cursor:pointer; font-weight:500;">
                            📊 Stats
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        /* ── Expiry Strategy Functions ────────────────────────────────── */
        async function showExpiryStats(expiryLabel, expiryIso) {
            selectedExpiryDate = expiryIso;
            const panel = document.getElementById('expiry-stats-panel');
            const container = document.getElementById('expiry-stats-container');
            const label = document.getElementById('expiry-date-label');
            
            label.textContent = expiryLabel;
            container.innerHTML = '<div style="text-align:center; grid-column:1/-1; color:var(--text-dim);">Loading performance data...</div>';
            panel.style.display = 'block';
            panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            
            try {
                const res = await fetch(`/api/expiry-strategy-stats/${expiryIso}`);
                const data = await res.json();
                
                if (data.status === 'success' && data.data && data.data.length > 0) {
                    container.innerHTML = '';
                    
                    // Group by strategy
                    const byStrategy = {};
                    data.data.forEach(stat => {
                        if (!byStrategy[stat.strategy]) {
                            byStrategy[stat.strategy] = [];
                        }
                        byStrategy[stat.strategy].push(stat);
                    });
                    
                    Object.entries(byStrategy).forEach(([strategy, stats]) => {
                        const totalTrades = stats.reduce((sum, s) => sum + s.total_trades, 0);
                        const totalWins = stats.reduce((sum, s) => sum + s.wins, 0);
                        const totalPnL = stats.reduce((sum, s) => sum + s.total_pnl, 0);
                        const winRate = totalTrades > 0 ? ((totalWins / totalTrades) * 100) : 0;
                        
                        const winColor = winRate >= 80 ? '#4ade80' : winRate >= 50 ? '#fbbf24' : '#f87171';
                        const pnlColor = totalPnL >= 0 ? '#4ade80' : '#f87171';
                        
                        const card = document.createElement('div');
                        card.style.cssText = 'background:rgba(255,255,255,0.03); border:1px solid #444; border-radius:6px; padding:1rem;';
                        card.innerHTML = `
                            <div style="font-weight:600; color:#e2e8f0; margin-bottom:0.5rem;">${strategy}</div>
                            <div style="font-size:0.85rem; color:var(--text-dim); space: nowrap;">
                                <div>Trades: <span style="color:#60a5fa;">${totalTrades}</span></div>
                                <div>Wins: <span style="color:${winColor};">${totalWins} (${winRate.toFixed(1)}%)</span></div>
                                <div>PnL: <span style="color:${pnlColor};">₹${totalPnL.toLocaleString()}</span></div>
                            </div>
                            <div style="font-size:0.8rem; color:var(--text-dim); margin-top:0.5rem;">
                                ${stats.map(s => `<div>${s.option_type}/${s.action}: ${s.total_trades} trades</div>`).join('')}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<div style="text-align:center; grid-column:1/-1; color:var(--text-dim);">No backtest data for this expiry date yet.</div>';
                }
            } catch (err) {
                console.error('Failed to fetch expiry stats:', err);
                container.innerHTML = '<div style="text-align:center; grid-column:1/-1; color:#f87171;">Error loading data</div>';
            }
        }

        function closeExpiryStats() {
            document.getElementById('expiry-stats-panel').style.display = 'none';
            selectedExpiryDate = null;
        }

        async function runBacktestForExpiry() {
            if (!selectedExpiryDate) {
                alert('Please select an expiry date first');
                return;
            }
            
            console.log(`Running backtest for expiry: ${selectedExpiryDate}`);
            alert(`Backtest for ${selectedExpiryDate} would run for all strategies. Redirecting to backtest page...`);
            window.location.href = `/backtest`;
        }

        /* ── Init ───────────────────────────────────── */
        window.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric', timeZone:'Asia/Kolkata' };
            document.getElementById('today-label').textContent = now.toLocaleDateString('en-IN', opts);
            loadExpiries();
        });
    </script>
</body>
</html>
